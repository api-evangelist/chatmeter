apis:
- name: Chatmeter API
  description: REST API for accessing and administrating all Chatmeter platform data including location listings, review management, social monitoring,
    surveys, and user administration. Uses JSON Web Token (JWT) authentication.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://support.chatmeter.com/hc/en-us/categories/4465860037275-Chatmeter-API
  baseURL: https://live.chatmeter.com/v5
  baseURL_note: 'Corrected 2026-08-13. The previously recorded base, https://newapi.chatmeter.com, no longer resolves in DNS (NXDOMAIN) — it is
    the host named in Chatmeter''s public references and in the README of the third-party Ruby client, and it was retired with no public notice.
    The live API answers on https://live.chatmeter.com/v5, verified by unauthenticated probe: POST /v5/login with an empty body returns HTTP 400
    with the Chatmeter error envelope naming the required username and password fields, and GET /v5/locations returns HTTP 401.'
  tags:
  - Reputation Management
  - Listings
  - Reviews
  - Social Media
  - Local SEO
