generated: '2026-08-13'
method: probed
source: >-
  Live probes of live.chatmeter.com, www.chatmeter.com, support.chatmeter.com, apidocs.chatmeter.com and
  help.alchemer.com on 2026-08-13, plus the www.chatmeter.com Yoast page sitemap.
name: Chatmeter API Lifecycle
api: Chatmeter API

versioning:
  scheme: path-prefix major version
  current: v5
  base: https://live.chatmeter.com/v5
  policy_published: false
  policy_note: >-
    No public versioning policy, support window, or version-support matrix was found. The major version
    is inferred from the mounted path and from the third-party Ruby wrapper, which hard-codes
    api_version 'v5'.

deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  evidence: >-
    No Sunset or Deprecation header appears on any observed response from live.chatmeter.com/v5, and no
    deprecation, retirement, or end-of-life page exists on www.chatmeter.com (the full Yoast page
    sitemap was walked — 46 pages, none developer- or API-facing).
  unannounced_change:
    what: API host migration
    from: newapi.chatmeter.com
    to: live.chatmeter.com
    detected: '2026-08-13'
    detail: >-
      newapi.chatmeter.com — the host Chatmeter's public documentation references and the host named in
      the README of the long-standing third-party Ruby client — no longer resolves in DNS (NXDOMAIN).
      The live API answers on live.chatmeter.com under the same /v5 prefix. No public notice, changelog
      entry, redirect, or Sunset header marks the move; the old host simply stopped existing, which
      breaks every integration that pinned it.

status_page:
