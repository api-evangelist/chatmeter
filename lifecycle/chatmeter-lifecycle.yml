    - type: gated-docs
      url: https://support.chatmeter.com/hc/en-us/categories/4465860037275-Chatmeter-API
      status: 401
      note: The API documentation category redirects to a Salesforce Experience Cloud community login.

corporate:
  acquisition:
    acquirer: Alchemer
    announced: '2025-09-24'
    source: blogs/2025-09-24-chatmeter-joins-alchemer-to-create-a-complete-picture-of.md
    api_impact: >-
      The chatmeter.com domain, the live.chatmeter.com API host and the /v5 surface all remain in place
      as of 2026-08-13. Product help has migrated to help.alchemer.com/help/chatmeter; API documentation
      has not, and remains on the credential-gated Chatmeter hosts.

deprecated_operations: []
