sla:
  published: false
  note: >-
    No public SLA or uptime commitment. Terms of service are published at
    https://www.chatmeter.com/terms-of-service/ but no availability target was located there.

support:
  channels:
    - type: form
      url: https://www.chatmeter.com/contactsupport/
