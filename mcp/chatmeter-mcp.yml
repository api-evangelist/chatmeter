blockers_for_a_real_server:
  - No published contract of any kind. There is no OpenAPI, GraphQL SDL, or Postman collection, so tool
    input schemas cannot be generated — they would have to be reverse-engineered against a paying tenant.
  - Both documentation hosts are credential-gated. support.chatmeter.com redirects to a Salesforce
    community login and apidocs.chatmeter.com answers HTTP Basic, so an agent cannot read the reference.
  - No self-serve credentials. Authentication is username/password against POST /v5/login for an existing
    tenant; there is no developer signup, API key page, or OAuth authorization server.
  - The 401 responses are empty — no body, no error code, no WWW-Authenticate — so an agent cannot
    distinguish an expired token from an unauthorized tenant.
  - No rate-limit headers and no documented limits, so an agent has no backoff signal.
  - No webhooks or event surface, so any server would have to poll for new reviews and listing changes.

