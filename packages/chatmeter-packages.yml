    decay_evidence: >-
      Last release 2019-05-01; last commit to github.com/G5/chatmeter 2021-08-12. The repository's
      version.rb declares 1.4.0, a version that was never published to RubyGems, so even the source tree
      is ahead of the last shipped gem. Its README names
      http://newapi.chatmeter.com/ as the API root, and its default host constant is
      live.chatmeter.com with api_version 'v5' — the newapi host has since gone NXDOMAIN, so any
      consumer following the README rather than the constant is broken.
