summary: >-
  Chatmeter publishes NO first-party client library for its API in any language, on any registry. The
  only API client that exists is a third-party Ruby gem written by the agency G5, last released in 2019
  and last committed in 2021 — six years and five years stale respectively, and it targets the
  newapi.chatmeter.com host that no longer resolves. No `SDKs` pointer is wired in apis.yml because
  there is no official SDK to point at.

