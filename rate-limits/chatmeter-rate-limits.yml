notes: >-
  No public rate limit documentation is available for the Chatmeter API. Authentication is a
  username/password token exchange (POST /v5/login) rather than a self-serve API key, so any quota is
  attached to a tenant contract rather than to a published plan. Customers should contact support or
  their Customer Success Manager for specific rate limit details.
